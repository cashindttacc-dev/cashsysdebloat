<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="120" height="60">
  <!-- Left parenthesis with C shape -->
  <g transform="translate(150, 80)">
    <path d="M 80 20 Q 40 20 40 80 Q 40 140 80 140" stroke="black" stroke-width="20" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Hashtag symbol -->
  <g transform="translate(340, 50)">
    <!-- Vertical lines -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="black" stroke-width="20" stroke-linecap="round"/>
    <line x1="80" y1="0" x2="80" y2="160" stroke="black" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Horizontal lines -->
    <line x1="-30" y1="40" x2="110" y2="40" stroke="black" stroke-width="20" stroke-linecap="round"/>
    <line x1="-30" y1="120" x2="110" y2="120" stroke="black" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
